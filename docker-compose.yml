services:
  kcal:
    build: .
    container_name: kcal
    restart: unless-stopped

    # Nur im LAN erreichbar. Soll die App ausschliesslich ueber eine
    # bestimmte Schnittstelle laufen, die IP davorschreiben, z. B.
    #   "192.168.0.42:8443:8443"
    ports:
      - "8101:8101"   # HTTP  - Katalog, Logging, manuelle Barcode-Eingabe
      - "8443:8443"   # HTTPS - zusaetzlich noetig fuer den Kamera-Scanner

    volumes:
      - ./data:/data  # Datenbank und Zertifikate

    environment:
      - TZ=Europe/Vienna
      - OFF_ONLINE=1  # 0 = keine Netzabfrage, nur lokaler Katalog

    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://localhost:8101/healthz')"]
      interval: 60s
      timeout: 5s
      retries: 3
